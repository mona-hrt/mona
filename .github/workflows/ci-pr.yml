name: CI - pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  release_preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'release')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! [[ "$PR_TITLE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::PR title must be exactly 'v<X>.<Y>.<Z>+<BUILD>' (e.g. 'v1.9.0+7'). Got: '$PR_TITLE'"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          BUILD="${BASH_REMATCH[2]}"

          CURRENT_BUILD=$(grep -m1 '^version:' pubspec.yaml | sed 's/.*+//')
          if ! [[ "$CURRENT_BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse current build number from pubspec.yaml (got: '$CURRENT_BUILD')"
            exit 1
          fi
          if (( BUILD <= CURRENT_BUILD )); then
            echo "::error::Build number ${BUILD} must be greater than current pubspec build ${CURRENT_BUILD}."
            exit 1
          fi

          if [[ -z "$(printf %s "$PR_BODY" | tr -d '[:space:]')" ]]; then
            echo "::error::Release notes (PR body) are empty."
            exit 1
          fi
          SIZE=$(printf '%s\n' "$PR_BODY" | wc -c)
          if (( SIZE > 500 )); then
            echo "::error::Release notes are ${SIZE} bytes (>500). IzzyOnDroid would truncate — please shorten the PR body."
            exit 1
          fi

          echo "✅ Release PR looks good: v${VERSION}+${BUILD} (current build ${CURRENT_BUILD}), body ${SIZE} bytes."
          
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  test_coverage:
    name: Tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --flavor standalone

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-standalone-debug.apk

  diff_breakdown:
    name: Diff breakdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute line-change breakdown
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          declare -A ADD DEL FILES
          for cat in generated i18n test code; do
            ADD[$cat]=0; DEL[$cat]=0; FILES[$cat]=0
          done

          # Collapse rename display forms
          normalize_path() {
            printf '%s' "$1" | sed -E 's/\{[^{}]* => ([^{}]*)\}/\1/g; s/^.* => //'
          }

          while IFS=$'\t' read -r added deleted path; do
            [ -z "${path:-}" ] && continue
            path="$(normalize_path "$path")"
            # Binary files report "-"
            [[ "$added" =~ ^[0-9]+$ ]] || added=0
            [[ "$deleted" =~ ^[0-9]+$ ]] || deleted=0

            if [ "$(git check-attr linguist-generated -- "$path" | sed 's/.*: //')" = "set" ]; then
              cat=generated
            elif [[ "$path" == *.i18next.json ]]; then
              cat=i18n
            elif [[ "$path" == fastlane/metadata/*.txt ]]; then
              cat=i18n
            elif [[ "$path" == test/* || "$path" == integration_test/* ]]; then
              cat=test
            else
              cat=code
            fi

            ADD[$cat]=$(( ADD[$cat] + added ))
            DEL[$cat]=$(( DEL[$cat] + deleted ))
            FILES[$cat]=$(( FILES[$cat] + 1 ))
          done < <(git diff --numstat "$BASE_SHA...$HEAD_SHA")

          total_files=0; total_add=0; total_del=0
          row() {
            local label="$1" key="$2"
            local a="${ADD[$key]}" d="${DEL[$key]}" f="${FILES[$key]}"
            local net=$(( a - d )) sign=""
            [ "$net" -ge 0 ] && sign="+"
            printf '| %s | %d | %d | %d | %s%d |\n' "$label" "$f" "$a" "$d" "$sign" "$net"
            total_files=$(( total_files + f ))
            total_add=$(( total_add + a ))
            total_del=$(( total_del + d ))
          }

          {
            echo "## Line-change breakdown"
            echo
            echo "| Category | Files | Added | Deleted | Net |"
            echo "|----------|------:|------:|--------:|----:|"
            row "Generated" generated
            row "i18n" i18n
            row "Test" test
            row "Code" code
            net_total=$(( total_add - total_del )) sign=""
            [ "$net_total" -ge 0 ] && sign="+"
            printf '| **Total** | %d | %d | %d | %s%d |\n' "$total_files" "$total_add" "$total_del" "$sign" "$net_total"
          } | tee diff-breakdown.md

      - name: Post breakdown as a sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: diff-breakdown
          path: diff-breakdown.md